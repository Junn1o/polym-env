# Builds every supported Minecraft version (Stonecutter) and runs the gametests.
# On master, a new mod_version in gradle.properties is released automatically as a
# GitHub release with one jar per Minecraft version.
#
# Runner choice: pushes by the repo owner run on the self-hosted runner when it is
# online, everything else (pull requests, forks, runner offline) runs on GitHub.
# The online check needs the repository secret RUNNER_STATUS_TOKEN: a fine-grained
# token with "Administration: Read" on this repository.

name: build

on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write

jobs:
  pick-runner:
    # pull requests from this repo are already covered by the push run of the same commit
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: pick runner
        id: pick
        env:
          TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          TRUSTED: ${{ github.event_name == 'push' && github.actor == github.repository_owner }}
          SELF_HOSTED_RUNNER: polym-env
        run: |
          runner='"ubuntu-24.04"'
          echo "event=${{ github.event_name }} actor=${{ github.actor }} owner=${{ github.repository_owner }} trusted=$TRUSTED"
          if [ "$TRUSTED" != "true" ]; then
            echo "Not a push by the owner, using GitHub runner"
          elif [ -z "$TOKEN" ]; then
            echo "RUNNER_STATUS_TOKEN is empty (must be a repository secret), using GitHub runner"
          else
            status=$(curl -sS -o runners.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners")
            echo "runners API HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Runners registered on this repo:"
              jq -r '.runners[] | "  \(.name) status=\(.status) busy=\(.busy) labels=\([.labels[].name] | join(","))"' runners.json
              online=$(jq --arg name "$SELF_HOSTED_RUNNER" '[.runners[] | select(.name == $name and .status == "online")] | length' runners.json)
              if [ "$online" -gt 0 ]; then
                runner='["self-hosted","Linux"]'
              else
                echo "$SELF_HOSTED_RUNNER is not registered on this repo or is offline"
              fi
            else
              jq -r '.message // empty' runners.json
            fi
          fi
          echo "Using runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 60
    # same environment on both runners; the self-hosted host only needs Docker
    container:
      image: eclipse-temurin:25-jdk-noble
      # named volume keeps the Gradle cache between runs on the self-hosted runner
      volumes:
        - polym-env-gradle:/gradle-home
    env:
      # HOME is /github/home inside container jobs, so pin the cache to the volume
      GRADLE_USER_HOME: /gradle-home
    steps:
      - name: install system packages
        # Loom wraps run tasks in xvfb-run when CI is set on Linux, even server gametests;
        # git so checkout fetches tags
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git xvfb xauth
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # the docker volume already holds the cache on the self-hosted runner
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build all versions
        run: ./gradlew buildAndCollect --console=plain
      # master only receives already-tested branches
      - name: server gametests
        if: github.ref != 'refs/heads/master'
        run: ./gradlew runGameTest --console=plain

      - name: read mod version
        id: version
        run: echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: capture build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: build/libs/${{ steps.version.outputs.mod_version }}/
      - name: capture gametest logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: Gametest-logs
          path: |
            versions/*/build/run/gameTest/logs/
            versions/*/build/run/gameTest/crash-reports/
          if-no-files-found: ignore

      # a release is only made when the version in gradle.properties has no tag yet
      - name: check release tag
        id: tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ steps.version.outputs.mod_version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists, skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: release new version
        if: steps.tag.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          name: Polym ${{ steps.version.outputs.mod_version }}
          generate_release_notes: true
          files: build/libs/${{ steps.version.outputs.mod_version }}/*.jar
          fail_on_unmatched_files: true

      # the container runs as root; hand the workspace back to the runner user so the
      # next self-hosted run can clean it
      - name: restore workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
